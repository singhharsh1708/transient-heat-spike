name: spike

# mosaic#375 idea 4 on CPU runners (ubuntu-latest: 4 cores, 16 GB). One process per case; result files are named
# <backend>-<strategy>-<nx>x<ny>-<steps>.json, and spike/run_case.py writes one even when a case is killed. Cases are
# killed at 13 GB of resident memory (recorded as such) so that running out of memory never takes the runner down.
# Per-case timeouts times the five step counts stay inside each job's timeout.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["spike/**", "backends/**", ".github/workflows/spike.yml"]

concurrency:
  group: spike-${{ github.ref }}
  cancel-in-progress: false

env:
  STEPS: "10 100 1000 10000 100000"
  MEM_LIMIT_MB: "13312"

jobs:
  jax:
    name: "JAX ${{ matrix.strategy }}, ${{ matrix.mesh }}"
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        strategy: [tape, checkpoint]
        mesh: ["32 16", "64 32", "128 64"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python "jax[cpu]==0.12.1" "numpy>=2" "scipy>=1.14"
      - name: Sweep
        run: |
          read -r nx ny <<< "${{ matrix.mesh }}"
          mkdir -p out
          if [ "$nx" = 32 ]; then  # once per strategy, in the smallest-mesh job
            .venv/bin/python spike/run_case.py "out/fdcheck-jax-${{ matrix.strategy }}-${nx}x${ny}.json" 600 -- \
              .venv/bin/python backends/jax/heat.py --nx 16 --ny 8 --steps 100 --strategy "${{ matrix.strategy }}" --fd
          fi
          for s in $STEPS; do
            .venv/bin/python spike/run_case.py "out/jax-${{ matrix.strategy }}-${nx}x${ny}-$s.json" 2400 \
              --mem-limit-mb "$MEM_LIMIT_MB" -- \
              .venv/bin/python backends/jax/heat.py --nx "$nx" --ny "$ny" --steps "$s" --strategy "${{ matrix.strategy }}"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jax-${{ matrix.strategy }}-${{ strategy.job-index }}
          path: out/

  julia:
    name: "OrdinaryDiffEq ${{ matrix.strategy }}, ${{ matrix.mesh }}"
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        strategy: [interp, interp-dense, quadrature, gauss, backsolve]
        mesh: ["32 16", "64 32"]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10.12"
      - uses: julia-actions/cache@v2
      - run: julia --project=backends/julia -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Sweep
        run: |
          read -r nx ny <<< "${{ matrix.mesh }}"
          mkdir -p out
          if [ "$nx" = 32 ]; then  # once per strategy, in the smallest-mesh job
            python3 spike/run_case.py "out/fdcheck-julia-${{ matrix.strategy }}-${nx}x${ny}.json" 900 -- \
              julia --project=backends/julia backends/julia/heat.jl --nx 16 --ny 8 --steps 100 --strategy "${{ matrix.strategy }}" --fd
          fi
          for s in $STEPS; do
            python3 spike/run_case.py "out/julia-${{ matrix.strategy }}-${nx}x${ny}-$s.json" 3300 \
              --mem-limit-mb "$MEM_LIMIT_MB" -- \
              julia --project=backends/julia backends/julia/heat.jl --nx "$nx" --ny "$ny" --steps "$s" --strategy "${{ matrix.strategy }}"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: julia-${{ matrix.strategy }}-${{ strategy.job-index }}
          path: out/

  firedrake:
    name: "Firedrake ${{ matrix.strategy }}, ${{ matrix.mesh }}"
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: firedrakeproject/firedrake-vanilla-default:2026.10.0
      options: --user root
    env:
      PETSC_OPTIONS: "-options_left 0"
      OMP_NUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        strategy: [tape, checkpoint]
        mesh: ["32 16", "64 32", "128 64"]
    steps:
      - uses: actions/checkout@v4
      - name: Sweep
        shell: bash
        run: |
          apt-get update -qq && apt-get install -y -qq time > /dev/null
          read -r nx ny <<< "${{ matrix.mesh }}"
          mkdir -p out
          if [ "$nx" = 32 ]; then  # once per strategy, in the smallest-mesh job
            python3 spike/run_case.py "out/fdcheck-firedrake-${{ matrix.strategy }}-${nx}x${ny}.json" 600 -- \
              python3 backends/firedrake/heat.py --nx 16 --ny 8 --steps 100 --strategy "${{ matrix.strategy }}" --fd
          fi
          for s in $STEPS; do
            python3 spike/run_case.py "out/firedrake-${{ matrix.strategy }}-${nx}x${ny}-$s.json" 2400 \
              --mem-limit-mb "$MEM_LIMIT_MB" -- \
              python3 backends/firedrake/heat.py --nx "$nx" --ny "$ny" --steps "$s" --strategy "${{ matrix.strategy }}"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firedrake-${{ matrix.strategy }}-${{ strategy.job-index }}
          path: out/

  kt:
    name: "k(T) follow-on: unrolled vs implicit Newton (JAX)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python "jax[cpu]==0.12.1" "numpy>=2" "scipy>=1.14"
      - name: Sweep
        run: |
          mkdir -p out
          for st in 10 50 200; do
            .venv/bin/python spike/run_case.py "out/kt-reference-$st.json" 240 -- \
              .venv/bin/python backends/jax/heat_kt.py --nx 16 --ny 8 --steps "$st" --reference
            for n in 1 2 3 5; do for df in unrolled implicit; do
              .venv/bin/python spike/run_case.py "out/kt-$df-n$n-$st.json" 240 -- \
                .venv/bin/python backends/jax/heat_kt.py --nx 16 --ny 8 --steps "$st" --newton "$n" --diff "$df"
            done; done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kt
          path: out/

  summary:
    needs: [jax, julia, firedrake, kt]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: astral-sh/setup-uv@v6
      - name: Summarise
        run: |
          set -o pipefail
          uv run --no-project --with matplotlib --with numpy --with scipy python spike/summarise.py artifacts summary \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: summary
          path: summary/
